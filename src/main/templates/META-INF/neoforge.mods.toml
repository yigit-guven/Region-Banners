modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/yigit-guven/Region-Banners/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/yigit-guven/Region-Banners"
updateJSONURL="https://raw.githubusercontent.com/yigit-guven/Region-Banners/main/update.json"
displayTest="IGNORE_ALL_VERSION"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="xaeroregions"
type="required"
versionRange="[1.0.0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="xaeroworldmap"
type="required"
versionRange="[1.44.2,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="xaerominimap"
type="optional"
versionRange="[26.0.0,)"
ordering="AFTER"
side="CLIENT"
